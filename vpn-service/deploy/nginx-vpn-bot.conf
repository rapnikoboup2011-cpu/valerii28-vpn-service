# Add this location block inside the existing panel.valerii28.ru server block
# (the one created for Remnawave, /etc/nginx/sites-available/remnawave-panel),
# BEFORE the catch-all `location / { proxy_pass http://127.0.0.1:3000; }` block.
# Nginx matches the longest prefix, so this takes precedence regardless of order,
# but keeping it above the catch-all is clearer to read.

location /yookassa/webhook {
    proxy_pass http://127.0.0.1:8080/yookassa/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
